[package]
name = "kodigocode"
version = "0.1.0"
edition = "2021"
authors = ["ritchegerona8@gmail.com"]
license = "Apache-2.0"

[[bin]]
name = "kc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
libloading = "0.8"
async-trait = "0.1"
dirs = "5"
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
pulldown-cmark = "0.13"
syntect = "5"
comrak = "0.30"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
parking_lot = "0.12"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
criterion = "0.5"
