[package]
name = "kodigocode"
version = "0.1.0"
edition = "2021"
authors = ["ritchegerona8@gmail.com"]
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
libloading = "0.8"
async-trait = "0.1"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
criterion = "0.5"
